<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SetRaporu görsel aracı</title>
<meta name="theme-color" content="#0f0e13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SetRaporu">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Playfair+Display:wght@900&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#f3f1ee;--panel:#fff;--ink:#16151a;--mute:#6d6a75;--line:#dcd8e0;--btn:#16151a;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e13;--panel:#1a1920;--ink:#f2f0f5;--mute:#9d9aa8;--line:#2e2c37;--btn:#f2f0f5;--btnt:#16151a}}
:root[data-theme="dark"]{--bg:#0f0e13;--panel:#1a1920;--ink:#f2f0f5;--mute:#9d9aa8;--line:#2e2c37;--btn:#f2f0f5;--btnt:#16151a}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overscroll-behavior-y:contain}
main{max-width:1150px;margin:0 auto;padding:16px;display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(0,430px) minmax(0,1fr);grid-template-areas:"controls pv" "controls actions"}
.panel,.controls,.actions{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pv{grid-area:pv;padding:16px;display:grid;gap:12px}
.controls{grid-area:controls;padding:4px 16px}
.actions{grid-area:actions;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions #note{flex:1 0 100%;order:-1}
canvas{max-width:100%;max-height:78vh;width:auto;height:auto;margin:0 auto;border-radius:8px;display:block;background:#222}
details.grp{border-top:1px solid var(--line)}
details.grp:first-child{border-top:0}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--mute)}
details[open]>summary::after{content:"▴"}
.inner{display:grid;gap:12px;padding:0 0 16px}
label{display:grid;gap:4px;font-weight:600;font-size:13px}
.hint{font-weight:400;color:var(--mute);font-size:12px;line-height:1.35}
input[type=text],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.on{outline:2px solid #3b82f6}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
h1{font-size:17px;margin:0}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr);grid-template-areas:"pv" "controls" "actions";padding:8px;gap:8px}
  .pv{position:sticky;top:0;z-index:5;padding:8px;gap:8px}
  canvas{max-height:38vh}
  #tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  #tabs button{flex:0 0 auto}
  .actions{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}
  .actions #note{grid-column:1/-1;font-size:11px}
  .actions button{padding:10px 6px;font-size:13px}
  input[type=text],textarea,select{font-size:16px;padding:11px 10px}
  button{min-height:44px}
  input[type=range]{height:34px}
  input[type=color]{height:44px}
}
</style>
</head>
<body>
<main>
<section class="panel pv" aria-label="Önizleme">
<canvas id="cv" width="1080" height="1350"></canvas>
<div class="bar" id="tabs"></div>
</section>

<section class="controls" aria-label="Ayarlar">
<details class="grp" open><summary>Metin ve görsel</summary><div class="inner">
<label>Bu slaytın görseli <span class="hint">Galerinden ya da indirdiğin bir görsel</span>
<input type="file" id="file" accept="image/*"></label>
<button class="alt" id="rmimg" type="button">Görseli kaldır</button>
<label>Kanca metin <span class="hint">*renk1* · _renk2_ · #kutu# · ^altı çizgili^ · Enter satır atlar</span>
<textarea id="hook"></textarea></label>
<label>Haber rozeti
<select id="badge"><option value="none">Yok</option><option>SON DAKİKA</option><option>FRAGMAN</option><option>YENİLENDİ</option><option>ÖZEL</option></select></label>
<div class="row">
<label>Görsel yakınlık <input type="range" id="zoom" min="100" max="250" value="100"></label>
<label>Görsel yatay <input type="range" id="ox" min="-100" max="100" value="0"></label>
</div>
<label>Görsel dikey <input type="range" id="oy" min="-100" max="100" value="0"></label>
</div></details>

<details class="grp"><summary>Stil (tüm slaytlar)</summary><div class="inner">
<div class="row">
<label>Hazır şablon
<select id="preset"><option value="haber">Haber</option><option value="alarm">Alarm</option><option value="fragman">Fragman</option></select></label>
<label>Format
<select id="fmt"><option value="45">4:5 post</option><option value="916">9:16 story / Reels</option><option value="11">1:1 kare</option></select></label>
</div>
<div class="row">
<label>Renk 1 <input type="color" id="c1" value="#3ddc84"></label>
<label>Renk 2 <input type="color" id="c2" value="#ffd60a"></label>
</div>
<div class="row">
<label>Font
<select id="font"><option value="anton">Anton</option><option value="bebas">Bebas Neue</option><option value="archivo">Archivo Black</option><option value="playfair">Playfair (zarif)</option></select></label>
<label>Yazı stili
<select id="style"><option value="shadow">Gölgeli</option><option value="band">Bantlı</option><option value="outline">Çerçeveli</option></select></label>
</div>
<div class="row">
<label>Yazı konumu
<select id="pos"><option value="bottom">Alt</option><option value="mid">Orta</option><option value="top">Üst</option></select></label>
<label>Alt yazı (kaynak) <input type="text" id="src" value="Kaynak: Deadline"></label>
</div>
<label>Yazı boyutu <input type="range" id="fs" min="60" max="170" value="120"></label>
<label>Karartma <input type="range" id="dark" min="0" max="90" value="35"></label>
</div></details>

<details class="grp"><summary>Sayfa adı, logo, şablonlar</summary><div class="inner">
<div class="row">
<label>Sayfa adı <input type="text" id="handle" value="@setraporu"></label>
<label>Sayfa adı görünsün mü <select id="showh"><option value="1">Göster</option><option value="0">Gizle</option></select></label>
</div>
<div class="row">
<label>Logo yükle <input type="file" id="logo" accept="image/*"></label>
<label>Logo boyutu <input type="range" id="lsize" min="30" max="220" value="64"></label>
</div>
<div class="bar"><button class="alt" id="rmlogo" type="button">Logoyu kaldır</button><button class="alt" id="rstpos" type="button">Konumları sıfırla</button></div>
<div class="row">
<label>Şablon adı <input type="text" id="tname" placeholder="Örn: Alarm kırmızı"></label>
<label>Kayıtlı şablon <select id="tlist"><option value="">Seç…</option></select></label>
</div>
<button class="alt" id="tsave" type="button">Şablonu kaydet</button>
</div></details>
</section>

<section class="actions" aria-label="Çıktı">
<div class="hint" id="note"></div>
<button id="save" type="button">Bu slaytı PNG kaydet</button>
<button id="zip" type="button">Hepsini indir (zip)</button>
<button id="reel" type="button">Reels (8 sn)</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const FMT={45:[1080,1350],916:[1080,1920],11:[1080,1080]};
const FONTS={anton:'400 {s}px Anton, Impact, sans-serif',bebas:'400 {s}px "Bebas Neue", Impact, sans-serif',archivo:'400 {s}px "Archivo Black", Impact, sans-serif',playfair:'900 {s}px "Playfair Display", Georgia, serif'};
const PRESETS={haber:{c1:'#3ddc84',c2:'#ffd60a',pos:'bottom',dark:35},alarm:{c1:'#ff3b30',c2:'#ffffff',pos:'bottom',dark:50},fragman:{c1:'#ffd60a',c2:'#3ddc84',pos:'mid',dark:40}};
const G=['c1','c2','pos','style','font','fmt','fs','dark','src','handle','preset','lsize','showh'];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const mk=()=>({img:null,hook:'Beklenen dönüş *resmen onaylandı*',zoom:100,ox:0,oy:0,badge:'none',tx:0,ty:0,bx:0,by:0});
const slides=[mk()];let cur=0,logoImg=null,busy=false;
const hit={},off={b:[0,0],s:[0,0]};
const note=t=>{$('note').textContent=t};

function tokens(t){
  const out=[];
  t.toLocaleUpperCase('tr').split('\n').forEach((line,li)=>{
    if(li)out.push({br:1});
    line.split(/(\*[^*]+\*|_[^_]+_|#[^#]+#|\^[^^]+\^)/).forEach(seg=>{
      if(!seg)return;
      let c=0,s=seg;
      const m={'*':1,'_':2,'#':3,'^':4}[seg[0]];
      if(m&&seg.length>2&&seg[seg.length-1]===seg[0]){c=m;s=seg.slice(1,-1)}
      s.split(/\s+/).filter(Boolean).forEach(w=>out.push({w,c}));
    });
  });
  return out;
}

function draw(p,idx=cur){
  const S=slides[idx],anim=p!==undefined,f=FMT[$('fmt').value];
  if(cv.width!==f[0]||cv.height!==f[1]){cv.width=f[0];cv.height=f[1]}
  const W=cv.width,H=cv.height,tall=H>1500;
  const fs=+$('fs').value,dark=+$('dark').value/100,pos=$('pos').value,style=$('style').value;
  const cols=['#fff',$('c1').value,$('c2').value];
  ctx.clearRect(0,0,W,H);hit.brand=hit.src=hit.badge=hit.text=null;hit.kx=hit.ky=0;
  if(S.img){
    const z=S.zoom/100*(anim?1+.1*p:1),sc=Math.max(W/S.img.width,H/S.img.height)*z;
    const dw=S.img.width*sc,dh=S.img.height*sc;
    hit.kx=(dw-W)/2;hit.ky=(dh-H)/2;
    ctx.drawImage(S.img,(W-dw)/2-(S.ox/100)*(dw-W)/2,(H-dh)/2-(S.oy/100)*(dh-H)/2,dw,dh);
  }else{
    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a2733');g.addColorStop(1,'#0e0d12');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.fillStyle='rgba(0,0,0,'+dark+')';ctx.fillRect(0,0,W,H);
  if(pos!=='mid'){
    const gr=pos==='top'?ctx.createLinearGradient(0,0,0,H*.65):ctx.createLinearGradient(0,H,0,H*.3);
    gr.addColorStop(0,'rgba(0,0,0,.8)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  const fontStr=s=>FONTS[$('font').value].replace('{s}',s);
  ctx.font=fontStr(fs);
  const sp=ctx.measureText(' ').width,maxW=W-180;
  const lines=[[]];let cw=0,total=0;
  tokens(S.hook).forEach(t=>{
    if(t.br){lines.push([]);cw=0;return}
    const w=ctx.measureText(t.w).width,L=lines[lines.length-1];
    if(cw+(L.length?sp:0)+w>maxW&&L.length){lines.push([]);cw=0}
    const L2=lines[lines.length-1];cw+=(L2.length?sp:0)+w;L2.push({...t,width:w});total++;
  });
  const lh=fs*1.08,bh=lines.length*lh,footY=H-(tall?260:80);
  const hasB=S.badge!=='none';
  const y0=pos==='top'?(tall?300:130)+(hasB?110:0):pos==='mid'?(H-bh)/2:footY-110-bh;
  const mw=Math.max(10,...lines.map(l=>l.reduce((a,t,k)=>a+t.width+(k?sp:0),0)));hit.text={x:90+S.tx,y:y0+S.ty,w:mw,h:bh};
  const shown=anim?Math.ceil(total*Math.min(1,p/.55)):total;
  let n=0;
  lines.forEach((ln,i)=>{
    const y=y0+S.ty+i*lh,lw=ln.reduce((a,t,k)=>a+t.width+(k?sp:0),0);
    if(style==='band'&&ln.length&&n<shown){ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(70+S.tx,y+fs*.04,lw+40,lh*.98)}
    let x=90+S.tx;
    ln.forEach(t=>{
      if(n++>=shown){x+=t.width+sp;return}
      ctx.textBaseline='top';
      if(t.c===3){ctx.fillStyle=cols[1];ctx.fillRect(x-10,y+fs*.04,t.width+20,lh*.98)}
      ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=style==='shadow'?18:0;
      if(style==='outline'){ctx.lineJoin='round';ctx.lineWidth=fs*.07;ctx.strokeStyle='#000';ctx.strokeText(t.w,x,y)}
      ctx.fillStyle=t.c===3?'#111':cols[t.c===4?0:t.c];
      ctx.fillText(t.w,x,y);ctx.shadowBlur=0;
      if(t.c===4){ctx.fillStyle=cols[1];ctx.fillRect(x,y+lh*.9,t.width,fs*.07)}
      x+=t.width+sp;
    });
  });
  ctx.shadowBlur=0;
  if(hasB){
    ctx.font='600 34px Inter, system-ui, sans-serif';ctx.textBaseline='middle';
    const bw=ctx.measureText(S.badge).width+44,by=(tall?250:100)+S.by,bx=90+S.bx;hit.badge={x:bx,y:by,w:bw,h:60};
    ctx.fillStyle=cols[1];ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,bw,60,10):ctx.rect(bx,by,bw,60);ctx.fill();
    ctx.fillStyle='#111';ctx.fillText(S.badge,bx+22,by+31);
  }
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const lsz=+$('lsize').value,showH=$('showh').value==='1'&&$('handle').value;
  ctx.font='600 32px Inter, system-ui, sans-serif';
  const bx0=90+off.b[0],by0=footY+off.b[1],tw=showH?ctx.measureText($('handle').value).width:0;
  if(logoImg){
    const h=lsz,w=logoImg.width/logoImg.height*h,top=by0-h*.78;
    ctx.drawImage(logoImg,bx0,top,w,h);
    if(showH){ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText($('handle').value,bx0+w+18,top+h/2+11)}
    hit.brand={x:bx0,y:top,w:w+(showH?18+tw:0),h};
  }else if(showH){
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText($('handle').value,bx0,by0);
    hit.brand={x:bx0,y:by0-32,w:tw,h:40};
  }
  const sx=W-90+off.s[0],sy=footY+off.s[1];
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillText($('src').value,sx,sy);
  const sw=ctx.measureText($('src').value).width;hit.src={x:sx-sw,y:sy-32,w:sw,h:40};ctx.textAlign='left';
}

function tabs(){
  const t=$('tabs');t.innerHTML='';
  slides.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent='Slayt '+(i+1);b.className=i===cur?'on':'alt';b.onclick=()=>{cur=i;toUI();tabs();draw()};t.appendChild(b)});
  const a=document.createElement('button');a.type='button';a.className='alt';a.textContent='+ Slayt ekle';a.onclick=()=>{slides.push(mk());slides[slides.length-1].hook='';cur=slides.length-1;toUI();tabs();draw()};t.appendChild(a);
  if(slides.length>1){const d=document.createElement('button');d.type='button';d.className='alt';d.textContent='Bu slaytı sil';d.onclick=()=>{slides.splice(cur,1);cur=Math.min(cur,slides.length-1);toUI();tabs();draw()};t.appendChild(d)}
}
const toUI=()=>{const S=slides[cur];['hook','zoom','ox','oy','badge'].forEach(k=>$(k).value=S[k])};
['hook','zoom','ox','oy','badge'].forEach(k=>$(k).addEventListener('input',()=>{const v=$(k).value;slides[cur][k]=['zoom','ox','oy'].includes(k)?+v:v;draw()}));
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{slides[cur].img=im;draw()};im.src=URL.createObjectURL(f);
});
$('logo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{logoImg=im;ls.set('sr_logo',r.result);draw()};im.src=r.result};r.readAsDataURL(f);
});

const gVals=()=>Object.fromEntries(G.map(k=>[k,$(k).value]));
const setG=o=>{G.forEach(k=>{if(o[k]!==undefined)$(k).value=o[k]})};
G.forEach(k=>$(k).addEventListener('input',()=>{ls.set('sr_g',JSON.stringify(gVals()));draw()}));
$('preset').addEventListener('change',e=>{setG(PRESETS[e.target.value]);ls.set('sr_g',JSON.stringify(gVals()));draw()});

function tplList(){
  let T={};try{T=JSON.parse(ls.get('sr_t')||'{}')}catch(e){}
  $('tlist').innerHTML='<option value="">Seç…</option>'+Object.keys(T).map(n=>'<option>'+n.replace(/</g,'&lt;')+'</option>').join('');
  return T;
}
$('tsave').onclick=()=>{const n=$('tname').value.trim();if(!n)return note('Şablon için bir ad yaz.');const T=tplList();T[n]=gVals();ls.set('sr_t',JSON.stringify(T));tplList();note('Şablon kaydedildi: '+n)};
$('tlist').onchange=e=>{const T=tplList();const n=e.target.value;if(T[n]){setG(T[n]);ls.set('sr_g',JSON.stringify(gVals()));draw();$('tlist').value=n}};

const MIME={png:'image/png',zip:'application/zip',mp4:'video/mp4',webm:'video/webm'};
const TOUCH=matchMedia('(pointer:coarse)').matches;
const canShareFiles=files=>{try{return !!(navigator.canShare&&navigator.canShare({files}))}catch(e){return false}};
async function saveFile(name,data){
  const type=MIME[name.split('.').pop()]||'application/octet-stream';
  if(TOUCH){
    const file=new File([data],name,{type});
    if(canShareFiles([file])){
      try{await navigator.share({files:[file]});return note('Paylaşım menüsü açıldı: “Görüntüyü kaydet” ya da Instagram’ı seç.')}
      catch(e){if(e&&e.name==='AbortError')return}
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();note('İndirildi: '+name);
}
const png=()=>new Promise(r=>cv.toBlob(r,'image/png')).then(b=>b.arrayBuffer()).then(a=>new Uint8Array(a));
$('save').onclick=async()=>{draw();await saveFile('setraporu-slayt-'+(cur+1)+'.png',await png())};

const T32=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=d=>{let c=-1;for(let i=0;i<d.length;i++)c=T32[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const buf=(len,fn)=>{const b=new Uint8Array(len),v=new DataView(b.buffer);fn(v);return b};
  files.forEach(f=>{
    const nm=enc.encode(f.name),c=crc(f.data),s=f.data.length,nl=nm.length;
    const lh=buf(30+nl,v=>{v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(12,33,true);v.setUint32(14,c,true);v.setUint32(18,s,true);v.setUint32(22,s,true);v.setUint16(26,nl,true)});
    lh.set(nm,30);
    const ch=buf(46+nl,v=>{v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x0800,true);v.setUint16(14,33,true);v.setUint32(16,c,true);v.setUint32(20,s,true);v.setUint32(24,s,true);v.setUint16(28,nl,true);v.setUint32(42,off,true)});
    ch.set(nm,46);cd.push(ch);parts.push(lh,f.data);off+=lh.length+s;
  });
  const cdS=cd.reduce((a,b)=>a+b.length,0);
  const end=buf(22,v=>{v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,cdS,true);v.setUint32(16,off,true)});
  return new Blob([...parts,...cd,end]);
}
$('zip').onclick=async()=>{
  if(busy)return;busy=true;note('Slaytlar hazırlanıyor…');
  const files=[];
  for(let i=0;i<slides.length;i++){draw(undefined,i);files.push({name:'slayt-'+(i+1)+'.png',data:await png()})}
  draw();
  if(TOUCH){
    const fl=files.map(f=>new File([f.data],f.name,{type:'image/png'}));
    if(canShareFiles(fl)){
      try{await navigator.share({files:fl});note('Paylaşım menüsü açıldı.');busy=false;return}
      catch(e){if(e&&e.name==='AbortError'){busy=false;return}}
    }
  }
  await saveFile('setraporu-slaytlar.zip',new Uint8Array(await zip(files).arrayBuffer()));
  busy=false;
};

$('reel').onclick=async()=>{
  if(busy)return;
  if(!cv.captureStream||!window.MediaRecorder)return note('Bu tarayıcı video kaydını desteklemiyor. Android’de Chrome ya da güncel Safari dene.');
  busy=true;$('reel').disabled=true;
  const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const ext=mime&&mime.startsWith('video/mp4')?'mp4':'webm';
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6}),ch=[];
  rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const done=new Promise(r=>{rec.onstop=r});
  rec.start();const t0=performance.now();
  await new Promise(res=>{const loop=()=>{const p=(performance.now()-t0)/8000;if(p>=1){draw(1);return res()}draw(p);note('Kaydediliyor… '+Math.round(p*100)+'%');requestAnimationFrame(loop)};loop()});
  await new Promise(r=>setTimeout(r,200));rec.stop();await done;
  draw();
  await saveFile('setraporu-reels.'+ext,new Uint8Array(await new Blob(ch,{type:mime}).arrayBuffer()));
  busy=false;$('reel').disabled=false;note('Hazır. Reels için 9:16 formatını kullan.');
};

try{const g=JSON.parse(ls.get('sr_g')||'null');if(g)setG(g)}catch(e){}
const lg=ls.get('sr_logo');if(lg){const im=new Image();im.onload=()=>{logoImg=im;draw()};im.src=lg}
try{Object.assign(off,JSON.parse(ls.get('sr_off')||'{}'))}catch(e){}
$('rmimg').onclick=()=>{slides[cur].img=null;$('file').value='';draw()};
$('rmlogo').onclick=()=>{logoImg=null;$('logo').value='';ls.set('sr_logo','');draw()};
$('rstpos').onclick=()=>{const S=slides[cur];off.b=[0,0];off.s=[0,0];S.tx=S.ty=S.bx=S.by=0;ls.set('sr_off',JSON.stringify(off));draw()};
let drag=null,pinch=null;const ptrs=new Map();
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
const inside=(b,x,y)=>b&&x>=b.x-12&&x<=b.x+b.w+12&&y>=b.y-12&&y<=b.y+b.h+12;
cv.style.touchAction='none';cv.style.cursor='move';
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z:slides[cur].zoom};drag=null;return}
  const[x,y]=pt(e);let k='img';
  if(inside(hit.brand,x,y))k='brand';else if(inside(hit.src,x,y))k='src';else if(inside(hit.badge,x,y))k='badge';else if(inside(hit.text,x,y))k='text';
  drag={k,x,y};
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){
    const[a,b]=[...ptrs.values()],S=slides[cur];
    S.zoom=Math.max(100,Math.min(250,Math.round(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d)));
    $('zoom').value=S.zoom;draw();return;
  }
  if(!drag)return;
  const[x,y]=pt(e),dx=x-drag.x,dy=y-drag.y,S=slides[cur];drag.x=x;drag.y=y;
  if(drag.k==='brand'){off.b[0]+=dx;off.b[1]+=dy}
  else if(drag.k==='src'){off.s[0]+=dx;off.s[1]+=dy}
  else if(drag.k==='badge'){S.bx+=dx;S.by+=dy}
  else if(drag.k==='text'){S.tx+=dx;S.ty+=dy}
  else{
    if(hit.kx>1)S.ox=Math.max(-100,Math.min(100,S.ox-dx/hit.kx*100));
    if(hit.ky>1)S.oy=Math.max(-100,Math.min(100,S.oy-dy/hit.ky*100));
    $('ox').value=S.ox;$('oy').value=S.oy;
  }
  draw();
});
const endDrag=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(drag&&!ptrs.size){ls.set('sr_off',JSON.stringify(off));drag=null}};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{e.preventDefault();const S=slides[cur];S.zoom=Math.max(100,Math.min(250,S.zoom-Math.sign(e.deltaY)*5));$('zoom').value=S.zoom;draw()},{passive:false});
tplList();toUI();tabs();draw();
const groups=[...document.querySelectorAll('details.grp')],wide=matchMedia('(min-width:821px)');
const openGroups=()=>groups.forEach((d,i)=>{d.open=wide.matches||i===0});openGroups();
note(TOUCH?'Yazı/logo/rozeti tutup sürükle · boş yerden sürükleyince görsel kayar · iki parmakla yakınlaştır.':'Önizlemede yazıyı, logoyu, rozeti ve kaynak satırını tutup sürükleyebilirsin. Boş yerden sürüklersen görsel kayar, fare tekerleği yakınlaştırır. Reels için 9:16 seç.');
if(TOUCH&&canShareFiles([new File(['x'],'a.png',{type:'image/png'})])){$('save').textContent='Kaydet / paylaş';$('zip').textContent='Hepsini paylaş'}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(document.fonts&&document.fonts.load){Promise.all(['Anton','Bebas Neue','Archivo Black','Playfair Display'].map(f=>document.fonts.load('900 80px "'+f+'"'))).then(()=>draw()).catch(()=>{})}
</script>
