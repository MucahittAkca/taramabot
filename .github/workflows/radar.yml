name: radar

on:
  workflow_dispatch:
    inputs:
      init:
        description: "İlk kurulum: mevcut haberleri görüldü say, havuzu boşalt, mesaj atma"
        type: boolean
        default: false
      now:
        description: "Taslak adımını saatini beklemeden hemen çalıştır (test)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Havuz ve görülen haberler (state.json) çalıştırmalar arasında cache'te tutulur
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Scan, and draft when it is time
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          WIRO_API_SECRET: ${{ secrets.WIRO_API_SECRET }}   # signature projeyse; yoksa boş kalsın
          WIRO_MODEL: "openai/gpt-6-1-terra"
          USE_REDDIT: "0"
          # İsteğe bağlı ayarlar (varsayılanlar notify.py başında): SLOTS, MIN_SCORE, POOL_MAX, FAIL_LIMIT...
        run: python notify.py ${{ inputs.init && '--init' || '' }} ${{ inputs.now && '--now' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: radar-state-${{ github.run_id }}
